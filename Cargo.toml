[package]
name = "ontodoc"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license-file = "LICENSE"
description = "Documentation graph-RAG MCP service with pre-registered retrieval evaluation"
publish = false

# Empty table: this package is its own workspace root, so `ontocode-rs/`
# (a read-only prior-attempt snapshot) is never resolved.
[workspace]

[lib]
path = "src/lib.rs"

[[bin]]
name = "ontodoc"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
pulldown-cmark = { version = "0.13", default-features = false }
rmcp = { version = "1.7", default-features = false, features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
# HTTP-2 listener plumbing (ADR rev 10): http1 server only, no TLS (ingress terminates it).
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
tokio-util = { version = "0.7", features = ["rt"] }
rustix = { version = "1.1.4", features = ["fs"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "net", "signal", "time"] }

[dev-dependencies]
pretty_assertions = "1"
rmcp = { version = "1.7", default-features = false, features = ["client", "server", "macros", "transport-io", "transport-streamable-http-server"] }
tempfile = "3"
hyper = { version = "1", default-features = false, features = ["client", "server", "http1"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util"] }

# Debug test builds hash large binaries and corpora (freeze/code identity,
# freshness); unoptimized sha2 dominated test wall time. Optimizing only the
# hash crates leaves ontodoc's own debug checks unchanged.
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.digest]
opt-level = 3

[profile.dev.package.block-buffer]
opt-level = 3
